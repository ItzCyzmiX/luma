name: Build SDL3

on:
  workflow_dispatch:

jobs:
  build:
    name: Build SDL3 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact: windows
          - os: ubuntu-latest
            artifact: linux
          - os: macos-latest
            artifact: macos

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout SDL3
        uses: actions/checkout@v4
        with:
          repository: libsdl-org/SDL
          path: SDL

      - name: Setup CMake
        uses: ./.github/actions/setup-cmake

      - name: Configure SDL3
        run: |
          cmake -S SDL -B build -DCMAKE_BUILD_TYPE=Release -DSDL_SHARED=ON -DSDL_STATIC=OFF 
        
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev \
            libxfixes-dev libxss-dev libxkbcommon-dev libxtst-dev \
            libwayland-dev wayland-protocols libdrm-dev libgbm-dev \
            libgl1-mesa-dev libegl1-mesa-dev \
            libasound2-dev libpulse-dev libudev-dev libdbus-1-dev

      - name: Configure & build SDL3
        run: |
          cmake -S SDL -B build-sdl3 -DCMAKE_BUILD_TYPE=Release -DSDL_SHARED=ON -DSDL_STATIC=OFF
          cmake --build build-sdl3 --config Release
          cmake --install build-sdl3 --prefix ${{ github.workspace }}/install-sdl3 --config Release

      # Windows
      - name: Prepare Windows binary
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p output
          cp build/Release/SDL3.dll output/SDL3.dll

      # Linux
      - name: Prepare Linux binary
        if: runner.os == 'Linux'
        run: |
          mkdir -p output
          cp build/libSDL3.so output/libSDL3.so

      # macOS
      - name: Prepare macOS binary
        if: runner.os == 'macOS'
        run: |
          mkdir -p output
          cp build/libSDL3.dylib output/libSDL3.dylib

      - name: Upload SDL3 binary
        uses: actions/upload-artifact@v4
        with:
          name: SDL3-${{ matrix.artifact }}
          path: output/
